---
- name: Install python3
  ansible.builtin.apt:
    name: [python3]
    state: present
    update_cache: true

- name: Create service user
  ansible.builtin.user:
    name: othmi
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: othmi
    group: othmi
    mode: "0755"
  loop:
    - "{{ ot_hmi_dir }}"
    - "{{ ot_hmi_log_dir }}"

- name: Install HMI
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ot_hmi_dir }}/{{ item }}"
    mode: "0755"
  loop: [mbtcp.py, hmi.py]
  notify: Restart ot-hmi

- name: Install systemd unit
  ansible.builtin.template:
    src: ot-hmi.service.j2
    dest: /etc/systemd/system/ot-hmi.service
    mode: "0644"
  notify: Restart ot-hmi

- name: Rotate HMI audit log
  ansible.builtin.copy:
    dest: /etc/logrotate.d/ot-hmi
    mode: "0644"
    content: |
      {{ ot_hmi_log_dir }}/*.jsonl {
        daily
        rotate 14
        compress
        missingok
        notifempty
        copytruncate
      }

- name: Enable and start HMI
  ansible.builtin.systemd:
    name: ot-hmi
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for HMI
  ansible.builtin.wait_for:
    port: "{{ ot_hmi_port }}"
    timeout: 60
