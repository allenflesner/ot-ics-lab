# yaml-language-server: $schema=https://docs.ludus.cloud/schemas/range-config.json
#
# OT-ICS Lab - FULL profile (~42 GB RAM, ~24 vCPU, ~450 GB disk)
# Purdue-model segmentation. All IPs are 10.<range#>.<vlan>.<octet>.
#
#   VLAN 10  L4   Enterprise IT        corp-ws (.21)
#   VLAN 20  L3.5 Industrial DMZ       ot-jump (.10)
#   VLAN 30  L2-3 Supervisory          ot-hmi (.10), ot-ews (.20)
#   VLAN 40  L1   Control              ot-plc (.10), ot-field (.20)
#   VLAN 50       SOC                  elastic (.10), ot-sensor (.20)
#   VLAN 99       Untrusted/attacker   kali (.10)
#
# Templates needed: debian-12-x64-server-template, kali-x64-desktop-template,
#                   win11-22h2-x64-enterprise-template
# Roles needed:     see docs/02-deploy.md (ludus ansible roles add ...)

ludus:
  # ---------------- SOC ----------------
  - vm_name: "{{ range_id }}-elastic"
    hostname: "{{ range_id }}-elastic"
    template: debian-12-x64-server-template
    vlan: 50
    ip_last_octet: 10
    ram_gb: 10
    cpus: 4
    linux: true
    testing:
      snapshot: false       # keep your telemetry when testing mode reverts the range
      block_internet: false
    roles:
      - badsectorlabs.ludus_elastic_container
    role_vars:
      ludus_elastic_password: "ChangeMe-OTlab-2026"
      ludus_elastic_stack_version: "8.17.4"   # must match ludus_elastic_agent_version below

  - vm_name: "{{ range_id }}-ot-sensor"
    hostname: "{{ range_id }}-ot-sensor"
    template: debian-12-x64-server-template
    vlan: 50
    ip_last_octet: 20
    ram_gb: 6
    cpus: 4
    linux: true
    testing:
      snapshot: false
      block_internet: false
    roles:
      - ot_sensor
      - badsectorlabs.ludus_elastic_agent

  # ---------------- L1 Control ----------------
  - vm_name: "{{ range_id }}-ot-plc"
    hostname: "{{ range_id }}-ot-plc"
    template: debian-12-x64-server-template
    vlan: 40
    ip_last_octet: 10
    ram_gb: 2
    cpus: 2
    linux: true
    roles:
      - ot_openplc
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-ot-field"
    hostname: "{{ range_id }}-ot-field"
    template: debian-12-x64-server-template
    vlan: 40
    ip_last_octet: 20
    ram_gb: 1
    cpus: 1
    linux: true
    roles:
      - ot_field_sim
      - badsectorlabs.ludus_elastic_agent

  # ---------------- L2-3 Supervisory ----------------
  - vm_name: "{{ range_id }}-ot-hmi"
    hostname: "{{ range_id }}-ot-hmi"
    template: debian-12-x64-server-template
    vlan: 30
    ip_last_octet: 10
    ram_gb: 2
    cpus: 2
    linux: true
    roles:
      - ot_hmi
      - badsectorlabs.ludus_elastic_agent

  - vm_name: "{{ range_id }}-ot-ews"
    hostname: "{{ range_id }}-OT-EWS"
    template: win11-22h2-x64-enterprise-template
    vlan: 30
    ip_last_octet: 20
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: false
      chocolatey_packages:
        - wireshark
        - python3
        - putty
        - notepadplusplus
    roles:
      - badsectorlabs.ludus_elastic_agent
    role_vars:
      ludus_elastic_install_sysmon: true

  # ---------------- L3.5 IDMZ ----------------
  - vm_name: "{{ range_id }}-ot-jump"
    hostname: "{{ range_id }}-ot-jump"
    template: debian-12-x64-server-template
    vlan: 20
    ip_last_octet: 10
    ram_gb: 1
    cpus: 1
    linux: true
    roles:
      - ot_jumphost
      - badsectorlabs.ludus_elastic_agent

  # ---------------- L4 Enterprise ----------------
  - vm_name: "{{ range_id }}-corp-ws"
    hostname: "{{ range_id }}-CORP-WS"
    template: win11-22h2-x64-enterprise-template
    vlan: 10
    ip_last_octet: 21
    ram_gb: 6
    cpus: 4
    windows:
      sysprep: false
      chocolatey_packages:
        - putty
    roles:
      - badsectorlabs.ludus_elastic_agent
    role_vars:
      ludus_elastic_install_sysmon: true

  # ---------------- Attacker ----------------
  - vm_name: "{{ range_id }}-kali"
    hostname: "{{ range_id }}-kali"
    template: kali-x64-desktop-template
    vlan: 99
    ip_last_octet: 10
    ram_gb: 6
    cpus: 4
    linux:
      packages:
        - python3
        - nmap
        - wireshark
        - ettercap-text-only
        - dsniff

global_role_vars:
  ludus_elastic_agent_version: "8.17.4"

network:
  inter_vlan_default: REJECT
  external_default: ACCEPT          # needed while building; see docs/02-deploy.md to lock down
  wireguard_vlan_default: ACCEPT    # lets you reach Kibana/HMI over Ludus WireGuard
  rules:
    # --- Telemetry: every zone may reach Fleet + Elasticsearch, nothing else in SOC
    - name: Agents to Fleet and Elasticsearch
      vlan_src: all
      vlan_dst: 50
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "8220,9200"
      action: ACCEPT

    # --- Purdue conduits (the ONLY legitimate paths into OT)
    - name: L4 Corp to IDMZ jump SSH
      vlan_src: 10
      vlan_dst: 20
      ip_last_octet_dst: 10
      protocol: tcp
      ports: 22
      action: ACCEPT
    - name: IDMZ jump to HMI web
      vlan_src: 20
      ip_last_octet_src: 10
      vlan_dst: 30
      ip_last_octet_dst: 10
      protocol: tcp
      ports: 8080
      action: ACCEPT
    - name: IDMZ jump to EWS RDP
      vlan_src: 20
      ip_last_octet_src: 10
      vlan_dst: 30
      ip_last_octet_dst: 20
      protocol: tcp
      ports: 3389
      action: ACCEPT
    - name: HMI to PLC Modbus
      vlan_src: 30
      ip_last_octet_src: 10
      vlan_dst: 40
      ip_last_octet_dst: 10
      protocol: tcp
      ports: 502
      action: ACCEPT
    - name: EWS to PLC Modbus and programming
      vlan_src: 30
      ip_last_octet_src: 20
      vlan_dst: 40
      ip_last_octet_dst: 10
      protocol: tcp
      ports: "502,8080"
      action: ACCEPT

    # --- Attacker starting position: "internet" can reach the corporate network
    - name: Attacker to Enterprise
      vlan_src: 99
      vlan_dst: 10
      protocol: all
      ports: all
      action: ACCEPT

    # --- SCENARIO TOGGLES (uncomment, then: ludus range deploy -t network)
    # Assumed breach of the control zone (scenarios 01-06 shortcut)
    # - name: SCENARIO assumed breach - Kali to Control
    #   vlan_src: 99
    #   vlan_dst: 40
    #   protocol: all
    #   ports: all
    #   action: ACCEPT
    # Misconfigured firewall: flat IT->OT (classic real-world finding)
    # - name: SCENARIO flat network - Corp to Control
    #   vlan_src: 10
    #   vlan_dst: 40
    #   protocol: all
    #   ports: all
    #   action: ACCEPT

ludus_extensions:
  ot_ics_lab:
    profile: full
    repo_version: "0.1.0"
